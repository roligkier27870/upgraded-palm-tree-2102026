<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Board</title>

  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background: #f4f4f4;
    }

    .layout { display: flex; gap: 24px; align-items: flex-start; }

    /* Wrapper so badges can be absolutely positioned over the board. */
    .board-wrap {
      position: relative;
      width: 480px;
      height: 480px;
    }
    #board { width: 480px; }

    /* Overlay layer for square badges. Sits above pieces, below nothing. */
    #board-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #board-overlay .sq-badge {
      position: absolute;
      width: 18px;
      height: 18px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      /* top-right of the square, small inset */
      margin: 2px;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
    }

    .side { width: 300px; display: flex; flex-direction: column; gap: 12px; }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }

    textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 12px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea { height: 110px; resize: vertical; }

    button {
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    button:disabled { opacity: 0.4; cursor: default; }

    .nav { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .nav button { min-width: 44px; font-size: 15px; }

    #status { margin-top: 12px; text-align: center; font-size: 15px; min-height: 22px; }

    #fen {
      margin-top: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #555;
      word-break: break-all;
      text-align: center;
      max-width: 480px;
    }

    /* Move list: badge sits at the top of the move text's box */
    #moves {
      max-height: 280px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      line-height: 2.1;
    }
    #moves .pair { display: flex; gap: 6px; align-items: flex-start; }
    #moves .num { color: #999; width: 26px; text-align: right; padding-top: 4px; }
    #moves .mv {
      cursor: pointer;
      padding: 0 4px;
      border-radius: 3px;
      min-width: 52px;
      display: inline-flex;
      align-items: flex-start;
      gap: 4px;
    }
    #moves .mv:hover { background: #eef; }
    #moves .mv.current { background: #cde; font-weight: bold; }

    #moves .mv .badge {
      display: inline-block;
      width: 15px;
      height: 15px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Shared icon classes for both the board overlay and the move list */
    .cls-brilliant  { background-image: url('icons/Brilliant.png'); }
    .cls-great      { background-image: url('icons/Great.png'); }
    .cls-best       { background-image: url('icons/Best.png'); }
    .cls-excellent  { background-image: url('icons/Excellent.png'); }
    .cls-good       { background-image: url('icons/Good.png'); }
    .cls-theory     { background-image: url('icons/Theory.png'); }
    .cls-inaccuracy { background-image: url('icons/Inaccuracy.png'); }
    .cls-mistake    { background-image: url('icons/Mistake.png'); }
    .cls-blunder    { background-image: url('icons/Blunder.png'); }

    #evalLine { font-size: 22px; font-weight: 600; font-family: monospace; text-align: center; padding: 4px 0; }
    #bestMove { font-family: monospace; font-size: 13px; text-align: center; color: #555; }
    #pvLine {
      font-family: monospace; font-size: 12px; text-align: center;
      color: #777; margin-top: 4px; min-height: 14px; word-break: break-word;
    }
    #engineStatus { font-size: 11px; color: #999; text-align: center; margin-top: 6px; }

    #analyzeAllBtn { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>

  <h1>Chess Board</h1>

  <div class="layout">
    <div>
      <div class="board-wrap">
        <div id="board"></div>
        <div id="board-overlay"></div>
      </div>
      <div id="status">White to move</div>
      <div id="fen"></div>
    </div>

    <div class="side">
      <div class="panel">
        <h3>Engine</h3>
        <div id="evalLine">—</div>
        <div id="bestMove">—</div>
        <div id="pvLine"></div>
        <div id="engineStatus">Loading engine…</div>
        <div style="margin-top:8px;">
          <button id="analyzeBtn" disabled>Analyze Position</button>
        </div>
      </div>

      <div class="panel">
        <h3>PGN</h3>
        <textarea id="pgnInput"
          placeholder="Paste PGN here, e.g.
1. e4 e5 2. Nf3 Nc6 3. Bb5 a6"></textarea>
        <div style="margin-top:8px; display:flex; gap:6px;">
          <button id="loadPgn">Load PGN</button>
          <button id="loadStart">Reset</button>
        </div>
      </div>

      <div class="panel">
        <h3>FEN</h3>
        <input type="text" id="fenInput" placeholder="Paste a FEN string">
        <div style="margin-top:8px;">
          <button id="loadFen">Load FEN</button>
        </div>
      </div>

      <div class="panel">
        <h3>Moves</h3>
        <div id="moves"><em style="color:#999">No game loaded</em></div>
        <div class="nav">
          <button id="first">⏮</button>
          <button id="prev">◀</button>
          <button id="next">▶</button>
          <button id="last">⏭</button>
        </div>
        <button id="analyzeAllBtn" disabled>Analyze Full Game</button>
        <div id="analyzeAllStatus" style="font-size:11px; color:#999; text-align:center; margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <script>
    const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

    // ---------- Unicode pieces ----------
    const UNICODE = {
      wK:'\u2654', wQ:'\u2655', wR:'\u2656',
      wB:'\u2657', wN:'\u2658', wP:'\u2659',
      bK:'\u265A', bQ:'\u265B', bR:'\u265C',
      bB:'\u265D', bN:'\u265E', bP:'\u265F'
    };

    function unicodePieceTheme(piece) {
      const glyph = UNICODE[piece] || '?';
      const isWhite = piece[0] === 'w';
      const fill = isWhite ? '#ffffff' : '#111111';
      const stroke = isWhite ? '#111111' : '#000000';
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">` +
          `<text x="50" y="78" font-size="82" text-anchor="middle" ` +
                `font-family="DejaVu Sans, Arial, sans-serif" ` +
                `fill="${fill}" stroke="${stroke}" stroke-width="1.5">` +
            glyph +
          `</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // ---------- State ----------
    let game = new Chess();
    let history = [];
    let cursor = 0;

    // ---------- Board ----------
    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: unicodePieceTheme,
      dropOffBoard: 'snapback',
      onDrop: onDrop,
      onSnapEnd: () => { board.position(game.fen()); renderBoardOverlay(); }
    });

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      history = history.slice(0, cursor);
      history.push({
        san: move.san,
        fen: game.fen(),
        uci: move.from + move.to + (move.promotion || ''),
        cls: null,
        cpLoss: null
      });
      cursor = history.length;

      renderAll();
    }

    // ---------- Board overlay (square badges) ----------
    // Board is 8x8. Files a..h left→right, ranks 8..1 top→bottom (from White's view).
    // chessboard.js flips orientation? We assume White at bottom, standard.
    function renderBoardOverlay() {
      const overlay = document.getElementById('board-overlay');
      if (!overlay) return;
      overlay.innerHTML = '';

      // Only show the badge for the move that just landed (the current ply),
      // or for every move up to cursor? We show the badge for the move at
      // position `cursor` — i.e. the last move played to reach the current
      // position.
      if (cursor === 0) return;
      const mv = history[cursor - 1];
      if (!mv || !mv.cls) return;

      const dest = mv.uci.slice(2, 4);      // 'e4'
      const file = dest[0];
      const rank = dest[1];

      // Board size in px (matches .board-wrap / #board width).
      const wrap = overlay.parentElement;
      const size = wrap.clientWidth;
      const sq = size / 8;

      const fileIdx = file.charCodeAt(0) - 'a'.charCodeAt(0);   // 0..7
      const rankIdx = 8 - parseInt(rank, 10);                   // 0..7 top→bottom

      const x = fileIdx * sq;
      const y = rankIdx * sq;

      const badge = document.createElement('div');
      badge.className = 'sq-badge cls-' + mv.cls;
      badge.style.left = x + 'px';
      badge.style.top  = y + 'px';
      badge.title = mv.cls;
      overlay.appendChild(badge);
    }

    // ---------- Rendering ----------
    function renderBoard() {
      board.position(game.fen(), false);
      renderBoardOverlay();
    }

    function renderStatus() {
      const turn = game.turn() === 'w' ? 'White' : 'Black';
      let msg = turn + ' to move';
      if (game.in_checkmate()) {
        msg = 'Checkmate — ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins';
      } else if (game.in_draw()) {
        msg = 'Draw';
      } else if (game.in_check()) {
        msg = turn + ' is in check';
      }
      document.getElementById('status').textContent = msg;
      document.getElementById('fen').textContent = game.fen();
    }

    function badgeFor(cls) {
      if (!cls) return '';
      return `<span class="badge cls-${cls}" title="${cls}"></span>`;
    }

    function renderMoves() {
      const el = document.getElementById('moves');
      if (history.length === 0) {
        el.innerHTML = '<em style="color:#999">No game loaded</em>';
        return;
      }

      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const num = (i / 2) + 1;
        const white = history[i];
        const black = history[i + 1];

        html += '<div class="pair">';
        html += `<span class="num">${num}.</span>`;

        const wIdx = i + 1;
        const wCls = cursor === wIdx ? 'mv current' : 'mv';
        html += `<span class="${wCls}" data-idx="${wIdx}">${badgeFor(white.cls)}${white.san}</span>`;

        if (black) {
          const bIdx = i + 2;
          const bCls = cursor === bIdx ? 'mv current' : 'mv';
          html += `<span class="${bCls}" data-idx="${bIdx}">${badgeFor(black.cls)}${black.san}</span>`;
        }
        html += '</div>';
      }
      el.innerHTML = html;

      el.querySelectorAll('.mv').forEach(span => {
        span.onclick = () => gotoPly(parseInt(span.dataset.idx, 10));
      });
    }

    function renderNavButtons() {
      document.getElementById('first').disabled = cursor === 0;
      document.getElementById('prev').disabled  = cursor === 0;
      document.getElementById('next').disabled  = cursor >= history.length;
      document.getElementById('last').disabled  = cursor >= history.length;
      document.getElementById('analyzeAllBtn').disabled =
        !sfReady || history.length === 0 || analyzingAll;
    }

    function renderAll() {
      renderBoard();
      renderStatus();
      renderMoves();
      renderNavButtons();
      scheduleAutoAnalyze();
    }

    // ---------- Navigation ----------
    function gotoPly(n) {
      n = Math.max(0, Math.min(n, history.length));
      game = new Chess();
      for (let i = 0; i < n; i++) game.move(history[i].san);
      cursor = n;
      renderAll();
    }

    document.getElementById('first').onclick = () => gotoPly(0);
    document.getElementById('prev').onclick  = () => gotoPly(cursor - 1);
    document.getElementById('next').onclick  = () => gotoPly(cursor + 1);
    document.getElementById('last').onclick  = () => gotoPly(history.length);

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft')  gotoPly(cursor - 1);
      if (e.key === 'ArrowRight') gotoPly(cursor + 1);
    });

    // ---------- PGN loading ----------
    document.getElementById('loadPgn').onclick = () => {
      const text = document.getElementById('pgnInput').value.trim();
      if (!text) return;

      const g = new Chess();
      try { g.load_pgn(text); }
      catch (err) { alert('Could not parse PGN: ' + err.message); return; }

      const replay = new Chess();
      const moves = g.history({ verbose: true });
      const newHistory = [];
      for (const m of moves) {
        replay.move(m.san);
        newHistory.push({
          san: m.san,
          fen: replay.fen(),
          uci: m.from + m.to + (m.promotion || ''),
          cls: null,
          cpLoss: null
        });
      }

      history = newHistory;
      cursor = history.length;
      game = replay;
      renderAll();
    };

    // ---------- FEN loading ----------
    document.getElementById('loadFen').onclick = () => {
      const fen = document.getElementById('fenInput').value.trim();
      if (!fen) return;
      const g = new Chess();
      try { g.load(fen); } catch (err) { alert('Invalid FEN'); return; }
      game = g; history = []; cursor = 0;
      renderAll();
    };

    // ---------- Reset ----------
    document.getElementById('loadStart').onclick = () => {
      game = new Chess(); history = []; cursor = 0;
      document.getElementById('pgnInput').value = '';
      document.getElementById('fenInput').value = '';
      document.getElementById('analyzeAllStatus').textContent = '';
      renderAll();
    };

    // ---------- Stockfish plumbing ----------
    let sf = null;
    let sfReady = false;
    let analyzingAll = false;
    let autoTimer = null;

    let engineQueue = [];
    let engineBusy = false;

    let lastPvUci = [];

    function initStockfish() {
      document.getElementById('engineStatus').textContent = 'Loading engine…';

      sf = new Worker('stockfish/stockfish-18-lite-single.js');

      sf.onerror = (err) => {
        document.getElementById('engineStatus').textContent =
          'Engine failed to load: ' + (err.message || 'unknown');
      };

      sf.onmessage = (e) => {
        const msg = e.data;
        if (msg === null || msg === undefined) return;
        const text = Array.isArray(msg) ? msg.join('\n') : String(msg);

        for (const raw of text.split('\n')) {
          const l = raw.trim();
          if (!l) continue;

          if (l === 'uciok')  { sf.postMessage('isready'); continue; }

          if (l === 'readyok') {
            sfReady = true;
            document.getElementById('engineStatus').textContent = 'Engine ready';
            document.getElementById('analyzeBtn').disabled = false;
            renderNavButtons();
            scheduleAutoAnalyze();
            continue;
          }

          if (engineBusy) handleEngineLine(l);
        }
      };

      sf.postMessage('uci');
    }

    function handleEngineLine(l) {
      const job = engineQueue[0];
      if (!job) return;

      if (l.startsWith('info') && l.includes(' score ')) {
        const parts = l.split(' ');

        const si = parts.indexOf('score');
        if (si !== -1 && parts[si + 1] && parts[si + 2]) {
          const type = parts[si + 1];
          const val  = parseInt(parts[si + 2], 10);
          if (!isNaN(val)) {
            if (type === 'cp')   { job.lastScore = val; job.lastMate = null; }
            if (type === 'mate') { job.lastMate  = val; job.lastScore = null; }

            if (job.owner === 'auto' || job.owner === 'manual') {
              document.getElementById('evalLine').textContent =
                formatScore(type, val, job.fen.split(' ')[1]);
            }
          }
        }

        const pi = parts.indexOf('pv');
        if (pi !== -1) {
          job.pvUci = parts.slice(pi + 1)
            .filter(x => /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(x));

          if (job.owner === 'auto' || job.owner === 'manual') {
            lastPvUci = job.pvUci;
            renderEngineLine(job.fen);
          }
        }
        return;
      }

      if (l.startsWith('bestmove')) {
        const move = l.split(' ')[1];
        job.bestUci = move;

        const turn = job.fen.split(' ')[1];
        let cpWhite = null;
        if (job.lastMate !== null && job.lastMate !== undefined) {
          const sign = (job.lastMate > 0 ? 1 : -1) * (turn === 'w' ? 1 : -1);
          cpWhite = sign * (10000 - Math.abs(job.lastMate) * 10);
        } else if (job.lastScore !== null && job.lastScore !== undefined) {
          cpWhite = turn === 'w' ? job.lastScore : -job.lastScore;
        }

        if (job.owner === 'auto' || job.owner === 'manual') {
          if (!lastPvUci.length && move && move !== '(none)') {
            lastPvUci = [move];
            renderEngineLine(job.fen);
          }
        }

        engineBusy = false;
        engineQueue.shift();
        job.resolve({ bestUci: move, cpWhite, pvUci: job.pvUci || [] });

        pumpEngineQueue();
        return;
      }
    }

    function pumpEngineQueue() {
      if (engineBusy) return;
      if (!engineQueue.length) return;
      const job = engineQueue[0];
      engineBusy = true;
      sf.postMessage('position fen ' + job.fen);
      sf.postMessage('go depth ' + job.depth);
    }

    function requestEval(fen, depth, owner = null) {
      return new Promise((resolve) => {
        if (!sfReady) { resolve(null); return; }
        engineQueue.push({
          fen, depth, owner, resolve,
          lastScore: null, lastMate: null, pvUci: []
        });
        pumpEngineQueue();
      });
    }

    function uciLineToSan(startFen, uciMoves) {
      const c = new Chess();
      try { c.load(startFen); } catch (e) { return []; }
      const sans = [];
      for (const uci of uciMoves) {
        const from  = uci.slice(0, 2);
        const to    = uci.slice(2, 4);
        const promo = uci.length > 4 ? uci[4] : undefined;
        const m = c.move({ from, to, promotion: promo || 'q' });
        if (!m) break;
        sans.push(m.san);
      }
      return sans;
    }

    function formatScore(type, val, turn) {
      if (type === 'cp') {
        const whiteCp = turn === 'w' ? val : -val;
        let s = (whiteCp / 100).toFixed(2);
        if (whiteCp > 0) s = '+' + s;
        return s;
      }
      const whiteMate = turn === 'w' ? val : -val;
      if (whiteMate > 0) return 'M' + whiteMate;
      return '-M' + Math.abs(whiteMate);
    }

    function renderEngineLine(fen) {
      if (!lastPvUci.length) {
        document.getElementById('bestMove').textContent = '—';
        document.getElementById('pvLine').textContent = '';
        return;
      }
      const sans = uciLineToSan(fen, lastPvUci);
      const best = sans[0] || lastPvUci[0];
      document.getElementById('bestMove').textContent = 'Best: ' + best;
      const line = sans.slice(1, 6).join(' ');
      document.getElementById('pvLine').textContent = line ? 'Line: ' + line : '';
    }

    function scheduleAutoAnalyze() {
      if (!sfReady || analyzingAll) return;
      if (autoTimer) clearTimeout(autoTimer);
      autoTimer = setTimeout(() => {
        autoTimer = null;
        document.getElementById('evalLine').textContent = '…';
        document.getElementById('bestMove').textContent = '…';
        document.getElementById('pvLine').textContent = '';
        lastPvUci = [];
        requestEval(game.fen(), 12, 'auto');
      }, 150);
    }

    document.getElementById('analyzeBtn').onclick = () => {
      document.getElementById('evalLine').textContent = '…';
      document.getElementById('bestMove').textContent = '…';
      document.getElementById('pvLine').textContent = '';
      lastPvUci = [];
      requestEval(game.fen(), 16, 'manual');
    };

    // ---------- Classification ----------
    function materialCount(fen) {
      let w = 0, b = 0;
      const boardStr = fen.split(' ')[0];
      for (const ch of boardStr) {
        const lower = ch.toLowerCase();
        if (PIECE_VALUES[lower] !== undefined && lower !== 'k') {
          if (ch === ch.toUpperCase()) w += PIECE_VALUES[lower];
          else                         b += PIECE_VALUES[lower];
        }
      }
      return { w, b };
    }

    function isTheory(moveIndex, san) {
      const BOOK = [
        ['e4','e5','Nf3','Nc6','Bb5','a6','Ba4','Nf6','O-O','Be7'],
        ['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','a6'],
        ['d4','d5','c4','e6','Nc3','Nf6','Bg5','Be7'],
        ['e4','e5','Nf3','Nc6','Bc4','Bc5','c3','Nf6'],
        ['d4','Nf6','c4','g6','Nc3','Bg7','e4','d6'],
        ['e4','e5','Nf3','Nc6','d4','exd4','Nxd4','Nf6'],
        ['e4','c6','d4','d5','Nc3','dxe4','Nxe4','Bf5'],
        ['e4','e6','d4','d5','Nc3','Nf6','e5','Nfd7'],
        ['d4','d5','c4','c6','Nf3','Nf6','Nc3','dxc4'],
        ['e4','d5','exd5','Qxd5','Nc3','Qa5','d4','Nf6'],
        ['c4','e5','Nc3','Nf6','Nf3','Nc6'],
        ['Nf3','d5','g3','Nf6','Bg2','e6']
      ];
      for (const line of BOOK) {
        if (moveIndex > line.length) continue;
        let matches = true;
        for (let i = 0; i < moveIndex - 1; i++) {
          if (history[i] && history[i].san !== line[i]) { matches = false; break; }
        }
        if (matches && line[moveIndex - 1] === san) return true;
      }
      return false;
    }

    async function classifyMove(index, depth = 10) {
      const mv = history[index - 1];
      if (!mv) return;

      const fenBefore = index === 1 ? START_FEN : history[index - 2].fen;
      const fenAfter  = mv.fen;

      if (isTheory(index, mv.san)) {
        mv.cls = 'theory';
        mv.cpLoss = 0;
        return;
      }

      const pre = await requestEval(fenBefore, depth, null);
      if (!pre || pre.cpWhite === null) return;

      const playedMatchesBest =
        pre.bestUci &&
        pre.bestUci !== '(none)' &&
        mv.uci.startsWith(pre.bestUci.slice(0, 4)) &&
        (mv.uci.length === 4 || mv.uci[4] === pre.bestUci[4]);

      if (playedMatchesBest) {
        const post = await requestEval(fenAfter, depth, null);
        if (!post) return;

        const moverIsWhite = fenBefore.split(' ')[1] === 'w';
        const preCpMover   = moverIsWhite ?  pre.cpWhite : -pre.cpWhite;
        const postCpMover  = moverIsWhite ? post.cpWhite : -post.cpWhite;
        const loss = Math.max(0, preCpMover - postCpMover);

        const matBefore = materialCount(fenBefore);
        const matAfter  = materialCount(fenAfter);
        const moverBefore = moverIsWhite ? matBefore.w : matBefore.b;
        const moverAfter  = moverIsWhite ? matAfter.w  : matAfter.b;
        const oppBefore   = moverIsWhite ? matBefore.b : matBefore.w;
        const oppAfter    = moverIsWhite ? matAfter.b  : matAfter.w;

        const moverLost = moverBefore - moverAfter;
        const oppLost   = oppBefore - oppAfter;
        const netSac   = oppLost - moverLost;

        if (netSac <= -1 && preCpMover >= 100) {
          mv.cpLoss = loss;
          mv.cls = 'brilliant';
          return;
        }

        mv.cpLoss = loss;
        mv.cls = loss <= 10 ? 'best' : 'great';
        return;
      }

      const post = await requestEval(fenAfter, depth, null);
      if (!post || post.cpWhite === null) return;

      const moverIsWhite = fenBefore.split(' ')[1] === 'w';
      const preCpMover   = moverIsWhite ?  pre.cpWhite : -pre.cpWhite;
      const postCpMover  = moverIsWhite ? post.cpWhite : -post.cpWhite;
      const loss = Math.max(0, preCpMover - postCpMover);

      mv.cpLoss = loss;
      mv.cls = classifyLoss(loss);
    }

    function classifyLoss(loss) {
      if (loss <= 10)  return 'best';
      if (loss <= 30)  return 'excellent';
      if (loss <= 60)  return 'good';
      if (loss <= 120) return 'inaccuracy';
      if (loss <= 250) return 'mistake';
      return 'blunder';
    }

    // ---------- Analyze Full Game ----------
    document.getElementById('analyzeAllBtn').onclick = async () => {
      if (analyzingAll || !sfReady || history.length === 0) return;

      analyzingAll = true;
      document.getElementById('analyzeAllBtn').disabled = true;

      const depth = 10;

      for (let i = 1; i <= history.length; i++) {
        document.getElementById('analyzeAllStatus').textContent =
          `Analyzing move ${i} / ${history.length}…`;

        await classifyMove(i, depth);

        renderMoves();
        renderBoardOverlay();
        renderNavButtons();
        await new Promise(r => setTimeout(r, 0));
      }

      analyzingAll = false;
      document.getElementById('analyzeAllBtn').disabled = false;
      document.getElementById('analyzeAllStatus').textContent = 'Done.';
      renderMoves();
      renderBoardOverlay();
    };

    // Re-render overlay on window resize so square math stays correct.
    window.addEventListener('resize', () => renderBoardOverlay());

    // ---------- Init ----------
    renderAll();
    initStockfish();
  </script>

</body>
