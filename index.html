<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Analyzer</title>

  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script type="module">
    import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
    window.Chess = Chess;
    window.dispatchEvent(new Event('chessjs-ready'));
  </script>

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #111318;
      --panel: #191c22;
      --panel-2: #20242c;
      --line: #2c313b;
      --text: #e8eaf0;
      --muted: #8d94a2;
      --green: #78d49b;
      --green-dark: #315b43;
      --blue: #6aa8ff;
      --red: #e88f8f;
      --light: #f0d9b5;
      --dark: #b58863;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #20242e 0, transparent 30%),
        linear-gradient(135deg, #101217, #0d0f13 70%);
      color: var(--text);
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(600px, 1fr) 440px;
    }
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 28px;
    }
    .topbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .logo {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 9px;
      background: #272c35;
      box-shadow: inset 0 1px 0 #3a404c;
      font-size: 20px;
    }
    .status {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px #78d49b88; }

    .board-row {
      display: flex;
      gap: 14px;
      align-items: stretch;
      width: 100%;
      max-width: 900px;
    }
    .evalbar-wrap {
      width: 16px;
      border-radius: 4px;
      background: #e7e7e7;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      align-self: stretch;
    }
    .evalfill {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%;
      height: 50%;
      background: #292b30;
      transition: height .4s ease;
    }
    .board-wrap {
      position: relative;
      flex: 1;
      aspect-ratio: 1;
      max-width: 100%;
    }
    #board { width: 100%; }

    #board-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #board-overlay .sq-badge {
      position: absolute;
      width: 38px; height: 38px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    #status {
      text-align: center;
      font-size: 15px;
      min-height: 22px;
      margin-top: 12px;
      color: var(--text);
    }
    .nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    .nav button { min-width: 52px; font-size: 18px; }
    #fen {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
      max-width: 100%;
      margin-top: 8px;
    }

    .sidebar {
      background: rgba(22,25,31,.96);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    .side-head {
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--line);
    }
    .title-row { display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size: 16px; margin: 0; }
    .gear { color: var(--muted); font-size: 18px; cursor:pointer; background: none; border: none; padding: 0; }
    .eval {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .score { font-size: 30px; font-weight: 750; letter-spacing: -.7px; }
    .depth { color: var(--muted); font-size: 12px; }
    .meter {
      height: 5px;
      background: #30343d;
      border-radius: 9px;
      overflow: hidden;
      margin-top: 12px;
    }
    .meter span {
      display: block;
      height: 100%;
      width: 51%;
      background: var(--green);
      border-radius: inherit;
      transition: width .3s;
    }
    .section {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }
    .section-title {
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 10px;
      color: #777f8d;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .line {
      display: grid;
      grid-template-columns: 27px 1fr auto;
      gap: 10px;
      align-items: baseline;
      padding: 9px 9px;
      margin: 2px -9px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .line:hover, .line.active { background: #252a33; }
    .rank { color: #69717e; font-size: 12px; }
    .pv { color: #b5bbc5; flex: 1; word-break: break-word; }
    .mini-score { font-size: 12px; color: var(--green); font-weight: 700; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }

    .moves-panel {
      display: flex;
      flex-direction: column;
      padding: 16px 22px 0;
    }
    .move-list {
      max-height: 340px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #15181d;
    }
    .move-row {
      display: grid;
      grid-template-columns: 38px 1fr 1fr;
      min-height: 36px;
      border-bottom: 1px solid #242831;
      align-items: center;
      font-size: 13px;
      font-family: ui-monospace, monospace;
    }
    .move-row:last-child { border: 0; }
    .move-no { color: #646c78; padding-left: 11px; }
    .move-cell { padding: 8px 6px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
    .move-cell:hover, .move-cell.active { background: #2b3039; color: white; }
    .move-cell .badge {
      display: inline-block;
      width: 18px; height: 18px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      flex-shrink: 0;
    }

    .cls-brilliant  { background-image: url('icons/Brilliant.png'); }
    .cls-great      { background-image: url('icons/Great.png'); }
    .cls-best       { background-image: url('icons/Best.png'); }
    .cls-excellent  { background-image: url('icons/Excellent.png'); }
    .cls-good       { background-image: url('icons/Good.png'); }
    .cls-theory     { background-image: url('icons/Theory.png'); }
    .cls-inaccuracy { background-image: url('icons/Inaccuracy.png'); }
    .cls-mistake    { background-image: url('icons/Mistake.png'); }
    .cls-blunder    { background-image: url('icons/Blunder.png'); }
    .cls-forced     { background-image: url('icons/Forced.png'); }
    .cls-miss       { background-image: url('icons/Miss.png'); }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 12px 0 16px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #22262e;
      color: #d9dce3;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }
    button:hover { background: #2b3039; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.full { width: 100%; }

    textarea, input[type="text"], select {
      width: 100%;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #15181d;
      color: var(--text);
      margin-bottom: 8px;
    }
    textarea { height: 90px; resize: vertical; }

    .io-buttons { display: flex; gap: 8px; margin-bottom: 8px; }
    .io-buttons button { flex: 1; }

    #aiOutput {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      padding: 10px;
      background: #15181d;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 70px;
      white-space: pre-wrap;
    }

    @media (max-width: 1000px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-left: 0; border-top: 1px solid var(--line); }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="app">

  <main class="main">
    <div class="topbar">
      <div class="brand"><div class="logo">♞</div> Chess Analyzer</div>
      <div class="status"><span class="dot"></span> <span id="statusDot">Loading engine…</span></div>
    </div>

    <div class="board-row">
      <div class="evalbar-wrap">
        <div class="evalfill" id="evalfill"></div>
      </div>
      <div class="board-wrap">
        <div id="board"></div>
        <div id="board-overlay"></div>
      </div>
    </div>

    <div id="status">White to move</div>
    <div class="nav">
      <button id="first">⏮</button>
      <button id="prev">◀</button>
      <button id="next">▶</button>
      <button id="last">⏭</button>
    </div>
    <div id="fen"></div>
  </main>

  <aside class="sidebar">

    <div class="side-head">
      <div class="title-row">
        <h1>Analysis</h1>
        <button class="gear" id="toggleTheme" title="Toggle theme">☾</button>
      </div>
      <div class="eval">
        <span class="score" id="evalLine">—</span>
        <span class="depth" id="engineStatus">Loading engine…</span>
      </div>
      <div class="meter"><span id="meter"></span></div>
    </div>

    <section class="section">
      <div class="section-title">Engine's Top 3 Lines</div>
      <div id="multiPv">
        <div class="line"><span class="rank">—</span><span class="pv">waiting…</span><span class="mini-score">—</span></div>
        <div class="line"><span class="rank">—</span><span class="pv">waiting…</span><span class="mini-score">—</span></div>
        <div class="line"><span class="rank">—</span><span class="pv">waiting…</span><span class="mini-score">—</span></div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">PGN</div>
      <textarea id="pgnInput" placeholder="Paste PGN here, e.g.&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6"></textarea>
      <div class="io-buttons">
        <button id="loadPgn">Load PGN</button>
        <button id="loadStart">Reset</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">FEN</div>
      <input type="text" id="fenInput" placeholder="Paste a FEN string">
      <div class="io-buttons">
        <button id="loadFen">Load FEN</button>
      </div>
    </section>

    <section class="moves-panel">
      <div class="section-title">Moves</div>
      <div class="move-list" id="moveList"><em style="color:#666; padding: 12px; display:block;">No game loaded</em></div>
      <div class="controls">
        <button id="first2">⏮</button>
        <button id="prev2">◀</button>
        <button id="next2">▶</button>
        <button id="last2">⏭</button>
      </div>
      <button class="full" id="analyzeAllBtn" disabled>Analyze Full Game</button>
      <div id="analyzeAllStatus" style="font-size:11px; color:var(--muted); text-align:center; margin:8px 0 16px;"></div>
    </section>

    <section class="section">
      <div class="section-title">AI Explanation</div>
      <select id="aiModel">
        <option value="deepseek-v4.1-flash:free">deepseek-v4.1-flash:free</option>
        <option value="mimo-v2.6-flash:free">mimo-v2.6-flash:free</option>
      </select>
      <button class="full" id="aiExplainBtn" style="margin-bottom:8px;">Explain Current Move</button>
      <div id="aiOutput"><em style="color:#666;">Load a game, analyze it, then click a move and hit Explain.</em></div>
    </section>

  </aside>

</div>

<script>
window.addEventListener('chessjs-ready', () => {

  const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
  const PROXY_URL = 'https://chess-analyzer-proxy.ju4nit3r78.workers.dev';

  const board = Chessboard('board', {
    draggable: true,
    position: 'start',
    pieceTheme: 'icons/{piece}.png',
    dropOffBoard: 'snapback',
    onDrop: onDrop,
    onSnapEnd: () => { board.position(game.fen()); renderBoardOverlay(); }
  });

  let game = new Chess();
  let history = [];
  let cursor = 0;

  function onDrop(source, target) {
    try {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      history = history.slice(0, cursor);
      history.push({
        san: move.san, fen: game.fen(),
        uci: move.from + move.to + (move.promotion || ''),
        cls: null, cpLoss: null, winDrop: null,
        evalBefore: null, evalAfter: null
      });
      cursor = history.length;
      renderAll();
    } catch (e) { return 'snapback'; }
  }

  function renderBoardOverlay() {
    const overlay = document.getElementById('board-overlay');
    if (!overlay) return;
    overlay.innerHTML = '';
    if (cursor === 0) return;
    const mv = history[cursor - 1];
    if (!mv || !mv.cls) return;

    const dest = mv.uci.slice(2, 4);
    const fileIdx = dest.charCodeAt(0) - 'a'.charCodeAt(0);
    const rankIdx = 8 - parseInt(dest[1], 10);

    const size = overlay.parentElement.clientWidth;
    const sq = size / 8;
    const badgeSize = 38;

    const badge = document.createElement('div');
    badge.className = 'sq-badge cls-' + mv.cls;
    badge.style.left = (fileIdx * sq + sq - badgeSize) + 'px';
    badge.style.top  = (rankIdx * sq) + 'px';
    badge.title = mv.cls;
    overlay.appendChild(badge);
  }

  function renderBoard() {
    board.position(game.fen(), false);
    renderBoardOverlay();
  }

  function renderStatus() {
    const turn = game.turn() === 'w' ? 'White' : 'Black';
    let msg = turn + ' to move';
    if (game.isCheckmate()) msg = 'Checkmate — ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins';
    else if (game.isDraw()) msg = 'Draw';
    else if (game.isCheck()) msg = turn + ' is in check';
    document.getElementById('status').textContent = msg;
    document.getElementById('fen').textContent = game.fen();
  }

  function badgeFor(cls) {
    if (!cls) return '';
    return `<span class="badge cls-${cls}"></span>`;
  }

  function renderMoves() {
    const el = document.getElementById('moveList');
    if (history.length === 0) {
      el.innerHTML = '<em style="color:#666; padding:12px; display:block;">No game loaded</em>';
      return;
    }
    let html = '';
    for (let i = 0; i < history.length; i += 2) {
      const num = (i / 2) + 1;
      const white = history[i];
      const black = history[i + 1];
      const wIdx = i + 1;
      const bIdx = i + 2;
      html += `<div class="move-row">
        <div class="move-no">${num}.</div>
        <div class="move-cell ${cursor === wIdx ? 'active' : ''}" data-idx="${wIdx}">${badgeFor(white.cls)}${white.san}</div>
        <div class="move-cell ${cursor === bIdx ? 'active' : ''}" data-idx="${bIdx}">${black ? badgeFor(black.cls) + black.san : ''}</div>
      </div>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('.move-cell').forEach(cell => {
      cell.onclick = () => {
        const idx = parseInt(cell.dataset.idx, 10);
        if (idx > 0 && idx <= history.length) gotoPly(idx);
      };
    });
  }

  function renderNavButtons() {
    ['first','prev','first2','prev2'].forEach(id => document.getElementById(id).disabled = cursor === 0);
    ['next','last','next2','last2'].forEach(id => document.getElementById(id).disabled = cursor >= history.length);
    document.getElementById('analyzeAllBtn').disabled = !sfReady || history.length === 0 || analyzingAll;
  }

  function renderAll() {
    renderBoard();
    renderStatus();
    renderMoves();
    renderNavButtons();
    scheduleAutoAnalyze();
  }

  function gotoPly(n) {
    n = Math.max(0, Math.min(n, history.length));
    game = new Chess();
    for (let i = 0; i < n; i++) {
      try { game.move(history[i].san); } catch (e) { break; }
    }
    cursor = n;
    renderAll();
  }

  document.getElementById('first').onclick = () => gotoPly(0);
  document.getElementById('prev').onclick  = () => gotoPly(cursor - 1);
  document.getElementById('next').onclick  = () => gotoPly(cursor + 1);
  document.getElementById('last').onclick  = () => gotoPly(history.length);
  document.getElementById('first2').onclick = () => gotoPly(0);
  document.getElementById('prev2').onclick  = () => gotoPly(cursor - 1);
  document.getElementById('next2').onclick  = () => gotoPly(cursor + 1);
  document.getElementById('last2').onclick  = () => gotoPly(history.length);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft')  gotoPly(cursor - 1);
    if (e.key === 'ArrowRight') gotoPly(cursor + 1);
  });

  document.getElementById('loadPgn').onclick = () => {
    const text = document.getElementById('pgnInput').value.trim();
    if (!text) return;
    const g = new Chess();
    try { g.loadPgn(text); }
    catch (err) { alert('Could not parse PGN: ' + err.message); return; }
    const replay = new Chess();
    const moves = g.history({ verbose: true });
    const newHistory = [];
    for (const m of moves) {
      try { replay.move(m.san); } catch (e) { break; }
      newHistory.push({
        san: m.san, fen: replay.fen(),
        uci: m.from + m.to + (m.promotion || ''),
        cls: null, cpLoss: null, winDrop: null,
        evalBefore: null, evalAfter: null
      });
    }
    history = newHistory;
    cursor = history.length;
    game = replay;
    renderAll();
  };

  document.getElementById('loadFen').onclick = () => {
    const fen = document.getElementById('fenInput').value.trim();
    if (!fen) return;
    try { game = new Chess(fen); }
    catch (err) { alert('Invalid FEN'); return; }
    history = []; cursor = 0;
    renderAll();
  };

  document.getElementById('loadStart').onclick = () => {
    game = new Chess(); history = []; cursor = 0;
    document.getElementById('pgnInput').value = '';
    document.getElementById('fenInput').value = '';
    document.getElementById('analyzeAllStatus').textContent = '';
    document.getElementById('aiOutput').innerHTML = '<em style="color:#666;">Load a game, analyze it, then click a move and hit Explain.</em>';
    renderAll();
  };

  document.getElementById('toggleTheme').onclick = () => {
    document.body.classList.toggle('light-mode');
  };

  // ---------- Stockfish ----------
  let sf = null;
  let sfReady = false;
  let analyzingAll = false;
  let autoTimer = null;
  let engineQueue = [];
  let engineBusy = false;
  let lastPvUci = [];
  let multiPvLines = [];

  function initStockfish() {
    document.getElementById('engineStatus').textContent = 'Loading engine…';
    document.getElementById('statusDot').textContent = 'Loading engine…';
    sf = new Worker('stockfish/stockfish-18-lite-single.js');

    sf.onerror = (err) => {
      document.getElementById('engineStatus').textContent = 'Engine error';
      document.getElementById('statusDot').textContent = 'Engine error';
    };

    sf.onmessage = (e) => {
      const msg = e.data;
      if (msg === null || msg === undefined) return;
      const text = Array.isArray(msg) ? msg.join('\n') : String(msg);
      for (const raw of text.split('\n')) {
        const l = raw.trim();
        if (!l) continue;
        if (l === 'uciok')  { sf.postMessage('isready'); continue; }
        if (l === 'readyok') {
          sfReady = true;
          document.getElementById('engineStatus').textContent = 'Engine ready';
          document.getElementById('statusDot').textContent = 'Engine ready';
          renderNavButtons();
          scheduleAutoAnalyze();
          continue;
        }
        if (engineBusy) handleEngineLine(l);
      }
    };
    sf.postMessage('uci');
  }

  function handleEngineLine(l) {
    const job = engineQueue[0];
    if (!job) return;

    if (l.startsWith('info') && l.includes(' score ')) {
      const parts = l.split(' ');
      const mi = parts.indexOf('multipv');
      const pvIdx = mi !== -1 ? parseInt(parts[mi + 1], 10) : 1;
      let score = null, mate = null;
      const si = parts.indexOf('score');
      if (si !== -1 && parts[si + 1] && parts[si + 2]) {
        const type = parts[si + 1];
        const val  = parseInt(parts[si + 2], 10);
        if (!isNaN(val)) {
          if (type === 'cp')   score = val;
          if (type === 'mate') mate  = val;
        }
      }
      const pi = parts.indexOf('pv');
      let pvUci = [];
      if (pi !== -1) {
        pvUci = parts.slice(pi + 1).filter(x => /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(x));
      }
      if (score !== null || mate !== null) {
        job.lines[pvIdx - 1] = { score, mate, pvUci };
      }
      if (job.owner === 'auto' || job.owner === 'manual') {
        multiPvLines = job.lines;
        renderMultiPv(job.fen);
        if (pvIdx === 1) {
          const turn = job.fen.split(' ')[1];
          let evalText = '—';
          if (score !== null) evalText = formatScore('cp', score, turn);
          else if (mate !== null) evalText = formatScore('mate', mate, turn);
          document.getElementById('evalLine').textContent = evalText;

          const cpWhite = score !== null ? (turn === 'w' ? score : -score) : null;
          if (cpWhite !== null) {
            const clamped = Math.max(-1000, Math.min(1000, cpWhite));
            const pct = 50 - (clamped / 1000) * 45;
            document.getElementById('evalfill').style.height = pct + '%';
            document.getElementById('meter').style.width = (100 - pct) + '%';
          }
        }
      }
      return;
    }

    if (l.startsWith('bestmove')) {
      const move = l.split(' ')[1];
      job.bestUci = move;
      const turn = job.fen.split(' ')[1];
      let cpWhite = null;
      const line1 = job.lines[0];
      if (line1) {
        if (line1.mate !== null && line1.mate !== undefined) {
          const sign = (line1.mate > 0 ? 1 : -1) * (turn === 'w' ? 1 : -1);
          cpWhite = sign * (10000 - Math.abs(line1.mate) * 10);
        } else if (line1.score !== null && line1.score !== undefined) {
          cpWhite = turn === 'w' ? line1.score : -line1.score;
        }
      }
      engineBusy = false;
      engineQueue.shift();
      job.resolve({
        bestUci: move, cpWhite,
        pvUci: line1 ? line1.pvUci : [],
        topLines: job.lines.slice(0, 3),
        fen: job.fen
      });
      pumpEngineQueue();
      return;
    }
  }

  function pumpEngineQueue() {
    if (engineBusy) return;
    if (!engineQueue.length) return;
    const job = engineQueue[0];
    engineBusy = true;
    sf.postMessage('setoption name MultiPV value ' + (job.multiPv || 1));
    sf.postMessage('position fen ' + job.fen);
    sf.postMessage('go depth ' + job.depth);
  }

  function requestEval(fen, depth, owner = null, multiPv = 1) {
    return new Promise((resolve) => {
      if (!sfReady) { resolve(null); return; }
      engineQueue.push({ fen, depth, owner, multiPv, resolve, lines: [] });
      pumpEngineQueue();
    });
  }

  function uciLineToSan(startFen, uciMoves) {
    const c = new Chess();
    try { c.load(startFen); } catch (e) { return []; }
    const sans = [];
    for (const uci of uciMoves) {
      const from = uci.slice(0, 2), to = uci.slice(2, 4);
      const promo = uci.length > 4 ? uci[4] : undefined;
      try { const m = c.move({ from, to, promotion: promo || 'q' }); sans.push(m.san); }
      catch (e) { break; }
    }
    return sans;
  }

  function formatScore(type, val, turn) {
    if (type === 'cp') {
      const whiteCp = turn === 'w' ? val : -val;
      let s = (whiteCp / 100).toFixed(2);
      if (whiteCp > 0) s = '+' + s;
      return s;
    }
    const whiteMate = turn === 'w' ? val : -val;
    if (whiteMate > 0) return 'M' + whiteMate;
    return '-M' + Math.abs(whiteMate);
  }

  function renderMultiPv(fen) {
    const container = document.getElementById('multiPv');
    const turn = fen.split(' ')[1];
    let html = '';
    for (let i = 0; i < 3; i++) {
      const line = multiPvLines[i];
      if (!line) {
        html += `<div class="line"><span class="rank">${i+1}</span><span class="pv">…</span><span class="mini-score">—</span></div>`;
        continue;
      }
      let scoreTxt = '—';
      let cls = 'mini-score';
      if (line.mate !== null && line.mate !== undefined) {
        scoreTxt = formatScore('mate', line.mate, turn);
      } else if (line.score !== null && line.score !== undefined) {
        scoreTxt = formatScore('cp', line.score, turn);
        const whiteCp = turn === 'w' ? line.score : -line.score;
        cls += whiteCp >= 0 ? ' positive' : ' negative';
      }
      const sans = uciLineToSan(fen, line.pvUci.slice(0, 8));
      const lineTxt = sans.join(' ') || '…';
      html += `<div class="line"><span class="rank">${i+1}</span><span class="pv">${lineTxt}</span><span class="${cls}">${scoreTxt}</span></div>`;
    }
    container.innerHTML = html;
  }

  function scheduleAutoAnalyze() {
    if (!sfReady || analyzingAll) return;
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      autoTimer = null;
      document.getElementById('evalLine').textContent = '…';
      lastPvUci = [];
      multiPvLines = [];
      renderMultiPv(game.fen());
      requestEval(game.fen(), 12, 'auto', 3);
    }, 150);
  }

  // ---------- Win probability ----------
  function cpToWinProb(cp) { return 1 / (1 + Math.exp(-0.00368208 * cp)); }

  function materialCount(fen) {
    let w = 0, b = 0;
    for (const ch of fen.split(' ')[0]) {
      const lower = ch.toLowerCase();
      if (PIECE_VALUES[lower] !== undefined && lower !== 'k') {
        if (ch === ch.toUpperCase()) w += PIECE_VALUES[lower];
        else                         b += PIECE_VALUES[lower];
      }
    }
    return { w, b };
  }

  function isTheory(moveIndex, san) {
    const BOOK = [
      ['e4','e5','Nf3','Nc6','Bb5','a6','Ba4','Nf6','O-O','Be7'],
      ['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','a6'],
      ['d4','d5','c4','e6','Nc3','Nf6','Bg5','Be7'],
      ['e4','e5','Nf3','Nc6','Bc4','Bc5','c3','Nf6'],
      ['d4','Nf6','c4','g6','Nc3','Bg7','e4','d6'],
      ['e4','e5','Nf3','Nc6','d4','exd4','Nxd4','Nf6'],
      ['e4','c6','d4','d5','Nc3','dxe4','Nxe4','Bf5'],
      ['e4','e6','d4','d5','Nc3','Nf6','e5','Nfd7'],
      ['d4','d5','c4','c6','Nf3','Nf6','Nc3','dxc4'],
      ['e4','d5','exd5','Qxd5','Nc3','Qa5','d4','Nf6'],
      ['c4','e5','Nc3','Nf6','Nf3','Nc6'],
      ['Nf3','d5','g3','Nf6','Bg2','e6']
    ];
    for (const line of BOOK) {
      if (moveIndex > line.length) continue;
      let matches = true;
      for (let i = 0; i < moveIndex - 1; i++) {
        if (history[i] && history[i].san !== line[i]) { matches = false; break; }
      }
      if (matches && line[moveIndex - 1] === san) return true;
    }
    return false;
  }

  function isForced(index) {
    const fenBefore = index === 1 ? START_FEN : history[index - 2].fen;
    let c;
    try { c = new Chess(fenBefore); } catch (e) { return false; }
    return c.moves().length === 1;
  }

  function isSacrifice(index) {
    const mv = history[index - 1];
    if (!mv) return false;
    const fenBefore = index === 1 ? START_FEN : history[index - 2].fen;
    const fenAfter  = mv.fen;
    let chessAfter, chessBefore;
    try {
      chessAfter  = new Chess(fenAfter);
      chessBefore = new Chess(fenBefore);
    } catch (e) { return false; }
    if (chessAfter.isCheckmate()) return false;
    if (chessAfter.isCheck())     return false;

    let playedMove;
    try {
      const tmp = new Chess(fenBefore);
      playedMove = tmp.move({
        from: mv.uci.slice(0, 2),
        to:   mv.uci.slice(2, 4),
        promotion: mv.uci.length > 4 ? mv.uci[4] : undefined
      });
    } catch (e) { return false; }

    const moverColor = playedMove.color;
    const oppColor   = moverColor === 'w' ? 'b' : 'w';
    const captured   = playedMove.captured;
    const board = chessAfter.board();
    const sacrificing = [];

    for (const row of board) {
      for (const sq of row) {
        if (!sq) continue;
        if (sq.color !== moverColor) continue;
        if (sq.type === 'p') continue;
        const squareName = sq.square;
        const attackers = chessAfter.attackers(squareName, oppColor);
        const defenders = chessAfter.attackers(squareName, moverColor);
        const beforeAttackers = chessBefore.attackers(squareName, oppColor);
        const beforeDefenders = chessBefore.attackers(squareName, moverColor);
        const wasAlreadyHanging = beforeAttackers.length > 0 && beforeDefenders.length === 0;

        if (playedMove.to === squareName) {
          if (attackers.length > 0 && defenders.length === 0) {
            const capturedVal = captured ? PIECE_VALUES[captured] : 0;
            const pieceVal = PIECE_VALUES[sq.type];
            if (capturedVal <= pieceVal) { sacrificing.push(squareName); continue; }
          }
        }
        if (!wasAlreadyHanging && defenders.length === 0 && attackers.length > 0) {
          const capturedVal = captured ? PIECE_VALUES[captured] : 0;
          const pieceVal = PIECE_VALUES[sq.type];
          if (capturedVal <= pieceVal) { sacrificing.push(squareName); continue; }
        }
        if (!wasAlreadyHanging && (sq.type === 'n' || sq.type === 'b') && defenders.length === 0) {
          const pawnAttacker = attackers.some(aSq => {
            const p = chessAfter.get(aSq); return p && p.type === 'p';
          });
          if (pawnAttacker) { sacrificing.push(squareName); continue; }
        }
        if (!wasAlreadyHanging && sq.type === 'r' && attackers.length > 0 &&
            captured !== 'r' && captured !== 'q' &&
            !(attackers.length === 1 &&
              (() => { const p = chessAfter.get(attackers[0]); return p && (p.type === 'q' || p.type === 'r'); })() &&
              defenders.length > 0) &&
            !(defenders.length > 0 && (captured === 'n' || captured === 'b'))) {
          sacrificing.push(squareName); continue;
        }
        if (!wasAlreadyHanging && sq.type === 'q' && attackers.length > 0 && captured !== 'q' &&
            !(attackers.length === 1 &&
              (() => { const p = chessAfter.get(attackers[0]); return p && p.type === 'q'; })() &&
              defenders.length > 0) &&
            !(attackers.length === 1 &&
              (() => { const p = chessAfter.get(attackers[0]); return p && p.type === 'r'; })() &&
              captured === 'r' && defenders.length > 0)) {
          sacrificing.push(squareName); continue;
        }
      }
    }

    for (const sq of sacrificing) {
      const afterPiece  = chessAfter.get(sq);
      const beforePiece = chessBefore.get(sq);
      const samePieceOnSquare = beforePiece && afterPiece &&
        beforePiece.color === afterPiece.color && beforePiece.type === afterPiece.type;
      const checkSquare = samePieceOnSquare ? sq : playedMove.from;
      if (couldBeSaved(chessBefore, checkSquare, moverColor)) return true;
    }
    return false;
  }

  function couldBeSaved(chess, square, color) {
    const oppColor = color === 'w' ? 'b' : 'w';
    const attackers = chess.attackers(square, oppColor);
    if (attackers.length === 0) {
      const moves = chess.moves({ verbose: true }).filter(m => m.from === square);
      return moves.length > 0;
    }
    const moves = chess.moves({ verbose: true }).filter(m => m.from === square);
    for (const m of moves) {
      let after;
      try { after = new Chess(m.after); } catch (e) { continue; }
      const stillAttacked = after.attackers(m.to, oppColor);
      if (stillAttacked.length === 0) return true;
    }
    return false;
  }

  async function isBrilliant(index, fenBefore, fenAfter, preCpMover, depth) {
    if (!isSacrifice(index)) return false;
    const brilliantDepth = Math.max(depth, 16);
    const post = await requestEval(fenAfter, brilliantDepth, null, 2);
    if (!post || post.cpWhite === null) return false;
    const moverIsWhite = fenBefore.split(' ')[1] === 'w';
    const postCpMover  = moverIsWhite ? post.cpWhite : -post.cpWhite;
    if (postCpMover < 0) return false;
    if (post.topLines && post.topLines.length > 0) {
      const sign = moverIsWhite ? -1 : 1;
      for (const line of post.topLines) {
        let cpForOpponent;
        if (line.mate !== null && line.mate !== undefined) {
          cpForOpponent = (line.mate > 0 ? 1 : -1) * (10000 - Math.abs(line.mate) * 10);
        } else if (line.score !== null && line.score !== undefined) {
          cpForOpponent = line.score;
        } else { continue; }
        if (sign * cpForOpponent < 0) return false;
      }
    }
    return true;
  }

  async function isOnlyGoodMove(fenBefore, depth) {
    const multi = await requestEval(fenBefore, depth, null, 2);
    if (!multi || !multi.topLines || multi.topLines.length < 2) return false;
    const moverIsWhite = fenBefore.split(' ')[1] === 'w';
    const toMoverCp = (line) => {
      let cpWhite;
      if (line.mate !== null && line.mate !== undefined) {
        const sign = (line.mate > 0 ? 1 : -1) * (moverIsWhite ? 1 : -1);
        cpWhite = sign * (10000 - Math.abs(line.mate) * 10);
      } else if (line.score !== null && line.score !== undefined) {
        cpWhite = moverIsWhite ? line.score : -line.score;
      } else { return null; }
      return cpWhite;
    };
    const bestCp   = toMoverCp(multi.topLines[0]);
    const secondCp = toMoverCp(multi.topLines[1]);
    if (bestCp === null || secondCp === null) return false;
    if (bestCp >= 9000) return true;
    return (bestCp - secondCp) >= 100;
  }

  // ---------- Miss detection ----------
  // A Miss = the mover had a winning position, played a non-best move,
  // and gave most of the advantage back. The engine's best move was
  // clearly better than what was played.
  //
  // Conditions:
  //   - Position before was winning for the mover (eval >= +2.0 / mate)
  //   - Played move was NOT the engine's top choice
  //   - Position after is no longer winning (eval < +1.0)
  //
  // Excluded: moves that were already forced, theory, or Brilliant.
  function isMiss(playedMatchesBest, preCpMover, postCpMover) {
    if (playedMatchesBest) return false;
    const wasWinning = preCpMover >= 200 || preCpMover >= 9000;
    if (!wasWinning) return false;
    const lostTheWin = postCpMover < 100 && postCpMover < preCpMover - 150;
    return lostTheWin;
  }

  async function classifyMove(index, depth = 14) {
    const mv = history[index - 1];
    if (!mv) return;
    const fenBefore = index === 1 ? START_FEN : history[index - 2].fen;
    const fenAfter  = mv.fen;
    if (isForced(index)) { mv.cls = 'forced'; mv.cpLoss = 0; mv.winDrop = 0; return; }
    if (isTheory(index, mv.san)) { mv.cls = 'theory'; mv.cpLoss = 0; mv.winDrop = 0; return; }

    const pre = await requestEval(fenBefore, depth, null, 1);
    if (!pre || pre.cpWhite === null) return;
    const playedMatchesBest = pre.bestUci && pre.bestUci !== '(none)' &&
      mv.uci.startsWith(pre.bestUci.slice(0, 4)) &&
      (mv.uci.length === 4 || mv.uci[4] === pre.bestUci[4]);
    const post = await requestEval(fenAfter, depth, null, 1);
    if (!post || post.cpWhite === null) return;
    const moverIsWhite = fenBefore.split(' ')[1] === 'w';
    const preCpMover  = moverIsWhite ?  pre.cpWhite : -pre.cpWhite;
    const postCpMover = moverIsWhite ? post.cpWhite : -post.cpWhite;
    mv.evalBefore = preCpMover;
    mv.evalAfter  = postCpMover;
    const clamp = v => Math.max(-1000, Math.min(1000, v));
    const preWin  = cpToWinProb(clamp(preCpMover));
    const postWin = cpToWinProb(clamp(postCpMover));
    const winDrop = Math.max(0, preWin - postWin);
    mv.cpLoss  = Math.max(0, preCpMover - postCpMover);
    mv.winDrop = winDrop;

    const brilliant = await isBrilliant(index, fenBefore, fenAfter, preCpMover, depth);
    if (brilliant) { mv.cls = 'brilliant'; return; }

    if (isMiss(playedMatchesBest, preCpMover, postCpMover)) {
      mv.cls = 'miss';
      return;
    }

    const bothWinning = preCpMover >= 900 && postCpMover >= 900;
    const bothLosing  = preCpMover <= -900 && postCpMover <= -900;
    if (bothWinning || bothLosing) { mv.cls = winDrop <= 0.005 ? 'best' : 'good'; return; }

    if (playedMatchesBest) {
      const great = await isOnlyGoodMove(fenBefore, depth);
      mv.cls = great ? 'great' : 'best';
      return;
    }
    mv.cls = classifyWinDrop(winDrop);
  }

  function classifyWinDrop(winDrop) {
    const pp = winDrop * 100;
    if (pp <= 0.5)  return 'best';
    if (pp <= 1.5)  return 'excellent';
    if (pp <= 3.5)  return 'good';
    if (pp <= 7)    return 'inaccuracy';
    if (pp <= 14)   return 'mistake';
    return 'blunder';
  }

  document.getElementById('analyzeAllBtn').onclick = async () => {
    if (analyzingAll || !sfReady || history.length === 0) return;
    analyzingAll = true;
    document.getElementById('analyzeAllBtn').disabled = true;
    const depth = 14;
    for (let i = 1; i <= history.length; i++) {
      document.getElementById('analyzeAllStatus').textContent = `Analyzing move ${i} / ${history.length}…`;
      await classifyMove(i, depth);
      renderMoves();
      renderBoardOverlay();
      renderNavButtons();
      await new Promise(r => setTimeout(r, 0));
    }
    analyzingAll = false;
    document.getElementById('analyzeAllBtn').disabled = false;
    document.getElementById('analyzeAllStatus').textContent = 'Done.';
    renderMoves();
    renderBoardOverlay();
  };

  // ---------- AI Explanation ----------
  document.getElementById('aiExplainBtn').onclick = async () => {
    const model  = document.getElementById('aiModel').value;
    const output = document.getElementById('aiOutput');
    if (cursor === 0) {
      output.innerHTML = '<em style="color:#d99">Load a game first.</em>';
      return;
    }
    const mv = history[cursor - 1];
    const fenBefore = cursor === 1 ? START_FEN : history[cursor - 2].fen;
    const fenAfter  = mv.fen;
    output.innerHTML = '<em style="color:#666;">Thinking…</em>';

    const prompt = `You are a chess coach. Explain this move in 2-3 short sentences.

Move played: ${mv.san} (${mv.uci})
Classification: ${mv.cls || 'unclassified'}
Position before (FEN): ${fenBefore}
Position after (FEN): ${fenAfter}
Eval before (mover POV, centipawns): ${mv.evalBefore ?? 'unknown'}
Eval after (mover POV, centipawns): ${mv.evalAfter ?? 'unknown'}

Explain in plain English why this move was classified as ${mv.cls || 'unclassified'}. If it's Brilliant, explain what the sacrifice accomplishes. If it's a Miss, explain what winning opportunity was overlooked. If it's a mistake or blunder, explain what was given up. Keep it under 3 sentences. No markdown.`;

    try {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 800,
          temperature: 0.7,
          enable_thinking: false
        })
      });
      if (!res.ok) {
        const errText = await res.text();
        output.innerHTML = `<em style="color:#e88f8f;">API error ${res.status}: ${errText.slice(0, 200)}</em>`;
        return;
      }
      const data = await res.json();
      const msg = data?.choices?.[0]?.message;
      let text = msg?.content?.trim();
      if (!text) text = msg?.reasoning_content?.trim();
      if (!text) {
        output.innerHTML = '<em style="color:#e88f8f;">Empty response from API.</em>';
        return;
      }
      output.textContent = text;
    } catch (err) {
      output.innerHTML = `<em style="color:#e88f8f;">Fetch failed: ${err.message}</em>`;
    }
  };

  window.addEventListener('resize', () => renderBoardOverlay());

  renderAll();
  initStockfish();

  window.getGame = () => game;
  window.getHistory = () => history;
  window.isSacrifice = isSacrifice;
  window.couldBeSaved = couldBeSaved;
  window.classifyMove = classifyMove;
  window.isBrilliant = isBrilliant;
  window.isMiss = isMiss;
  window.materialCount = materialCount;

});
</script>

</body>
</html>
